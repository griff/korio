[workspace]
metadata.crane.name = "korio-workspace"
package.rust-version = "1.94.0"
resolver = "2"
members = [
    "korio",
    "korio-core",
    "korio-capnp",
    "korio-capture",
    "korio-capture-data",
    "korio-data",
    "korio-format",
    "korio-format-koriob",
    "korio-format-koriosc",
    "korio-format-koriosj",
    "korio-subscriber",
    #"korio-tracing",
]

[workspace.lints.rust]
rust_2024_compatibility = { level = "warn", priority = -1 }
# No need to enable those, because it either not needed or results in ugly syntax
#edition_2024_expr_fragment_specifier = "allow"
#if_let_rescope = "allow"
#tail_expr_drop_order = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = 1 }

[workspace.dependencies]
# Workspace members
korio.path = "./korio"
korio-core.path = "./korio-core"
korio-capnp.path = "./korio-capnp"
korio-capture.path = "./korio-capture"
korio-capture-data.path = "./korio-capture-data"
korio-data.path = "./korio-data"
korio-format.path = "./korio-format"
korio-subscriber.path = "./korio-subscriber"

# Others
auto_impl = "^1.3.0"
byteorder = "^1.5.0"
capnp = "^0.27.2"
capnp-convert.path = "../Nix.rs/capnp-convert"
capnp-futures = "^0.27.0"
capnp-rpc = "^0.27.1"
capnpc = "^0.27.0"
futures-channel = "^0.3.34"
futures-core = "^0.3.34"
futures-sink = "^0.3.34"
futures-util = "^0.3.34"
http = "^1.5.0"
nixrs.path = "../Nix.rs/nixrs"
num_enum = "^0.7.6"
parking_lot = "^0.12.5"
pin-project-lite = "^0.2"
pretty_assertions = "^1.4.1"
proptest = "1.12.0"
rand = { version = "^0.10.3", features = ["thread_rng"] }
rstest = "^0.27.0"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
smallvec = "^1.16.3"
smol_str = "^0.3.6"
test-log = { version = "^0.2.21", features = ["trace"] }
test-strategy = "0.4.5"
thiserror = "^2.0"
thread_local = "^1.1.10"
tokio = { version = "^1.52.3", default-features = false }
tokio-util = "^0.7.13"
tracing = "^0.1.44"
tracing-core = "^0.1.36"
valuable = "^0.1.1"
which = "^8.0.6"
